[package]
name = "heimdall-capture"
version = "0.1.0"
description = "Heimdall desktop capture client — bundled Intel PresentMon, signed uploads (§21–§22)."
authors = ["Heimdall contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"
publish = false

# The webview does all parsing and UI (§22.1 "same code as web"); this crate
# owns everything the webview cannot do or must not hold: the PresentMon
# sidecar, foreground-process detection, hardware collection, the Ed25519
# private key, and the direct-to-R2 PUT.

[lib]
name = "heimdall_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-http = "2.5"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-store = "2.4"

base64 = "0.23"
futures-util = "0.3"
ed25519-dalek = { version = "3.0", features = ["pkcs8", "alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "stream", "http2", "charset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "process", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

# Auto-update is only wired into release builds; see tauri.conf.json and
# docs/desktop-client.md for the three distinct keys involved.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10"

[features]
# Enabled by the release workflow. It exposes the signed-channel check/install
# commands; contributor builds return "no update" and need no updater keypair.
release-updates = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
