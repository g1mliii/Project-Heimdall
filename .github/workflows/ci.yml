name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / shared (pnpm verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heimdall_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heimdall_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version # single source of truth with local dev (§0.8)
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm audit:deps
      # The web tests import the published @heimdall/ui entrypoint, whose
      # package exports target dist/. Build it in CI's clean checkout first.
      - run: pnpm --filter @heimdall/ui build
      - run: pnpm verify # lint + typecheck + test across the workspace
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heimdall_test
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Forked and Dependabot PRs cannot access repository secrets; trusted
          # pushes and same-repository human PRs must still exercise live R2.
          R2_LIVE_REQUIRED: ${{ github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - run: pnpm build
      - run: pnpm --filter @heimdall/web exec playwright install --with-deps chromium
      # Cross-platform visual baselines are tracked separately; keep the
      # functional upload flows mandatory on every PR.
      - run: pnpm --filter @heimdall/web test:e2e:functional

  desktop:
    name: Desktop (cargo fmt / clippy / test / bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - id: detect
        shell: bash
        run: |
          if [ -f apps/desktop/src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Desktop client not scaffolded yet — skipping Rust gate."
          fi

      # The sidecar must exist BEFORE any cargo command: tauri-build validates
      # `bundle.externalBin` from build.rs, so even `cargo clippy` fails with
      # "resource path ... doesn't exist" without it. Node setup therefore comes
      # first, not just before the bundle step.
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Verifies the pinned SHA-256 before installing; also vendors the fonts
      # the Vite build inlines.
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/desktop vendor

      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Without a cache every PR rebuilds the whole Tauri dependency tree from
      # scratch, which is the difference between a ~3-minute job and a ~20-minute
      # one.
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings -D clippy::perf

      - if: steps.detect.outputs.present == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/ui build

      # Unsigned and non-updating: the Authenticode certificate and the updater
      # keypair live in the release workflow's overlay config, not here, so a
      # fork's CI builds the same artifact without any secrets.
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/desktop exec tauri build

  desktop-linux:
    name: Desktop Linux (cargo clippy / test / bundle)
    runs-on: ubuntu-latest
    # A second job rather than a matrix on `desktop`: the two platforms share no
    # setup worth factoring. This one vendors no sidecar, installs GTK/WebKit,
    # and builds appimage+deb; the Windows one fetches a Win32 binary and builds
    # an NSIS installer. A matrix would be `if:` on nearly every step.
    #
    # Its real job is to compile the `#[cfg(target_os = "linux")]` code at all.
    # cfg'd-out code is never type-checked, so the MangoHud watcher and the
    # /proc-and-/sys reads (§23.1, §23.2) are invisible to the Windows job — the
    # pure rules are covered there by tests, but the platform halves are not
    # compiled until here.
    steps:
      - uses: actions/checkout@v7

      - id: detect
        run: |
          if [ -f apps/desktop/src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Desktop client not scaffolded yet — skipping the Linux gate."
          fi

      # Tauri's Linux build needs the webview and its toolchain from the distro.
      # libayatana-appindicator3-dev is what the tray icon links against; without
      # it the build fails rather than silently shipping an app with no tray.
      - if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Fetches the webfonts the Vite build inlines. fetch-presentmon.mjs still
      # asserts the version pin agrees with presentmon.rs, then exits without
      # downloading: the sidecar is a Win32 executable and `externalBin` names it
      # only in tauri.windows.conf.json (§24.1).
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/desktop vendor

      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: linux

      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings -D clippy::perf

      # The same suite the Windows job runs. Most of it is platform-neutral by
      # construction (mangohud.rs and linux.rs are pure), so a divergence between
      # the two runs is itself the signal.
      - if: steps.detect.outputs.present == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/ui build

      # Proves the bundle targets in tauri.linux.conf.json actually resolve.
      # Unsigned and non-updating, same as the Windows job.
      #
      # The Flatpak manifest is NOT built here: flatpak-builder downloads a whole
      # SDK and takes longer than the rest of CI combined, so it is a separate
      # workflow_dispatch job (apps/desktop/flatpak/dev.heimdall.capture.yml).
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/desktop exec tauri build --bundles appimage,deb
