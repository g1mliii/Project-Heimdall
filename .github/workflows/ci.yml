name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / shared (pnpm verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heimdall_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heimdall_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version # single source of truth with local dev (§0.8)
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm audit:deps
      # The web tests import the published @heimdall/ui entrypoint, whose
      # package exports target dist/. Build it in CI's clean checkout first.
      - run: pnpm --filter @heimdall/ui build
      - run: pnpm verify # lint + typecheck + test across the workspace
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heimdall_test
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Forked and Dependabot PRs cannot access repository secrets; trusted
          # pushes and same-repository human PRs must still exercise live R2.
          R2_LIVE_REQUIRED: ${{ github.event_name == 'push' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
      - run: pnpm build
      - run: pnpm --filter @heimdall/web exec playwright install --with-deps chromium
      # Cross-platform visual baselines are tracked separately; keep the
      # functional upload flows mandatory on every PR.
      - run: pnpm --filter @heimdall/web test:e2e:functional

  desktop:
    name: Desktop (cargo fmt / clippy / test / bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - id: detect
        shell: bash
        run: |
          if [ -f apps/desktop/src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Desktop client not scaffolded yet — skipping Rust gate."
          fi

      # The sidecar must exist BEFORE any cargo command: tauri-build validates
      # `bundle.externalBin` from build.rs, so even `cargo clippy` fails with
      # "resource path ... doesn't exist" without it. Node setup therefore comes
      # first, not just before the bundle step.
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Verifies the pinned SHA-256 before installing; also vendors the fonts
      # the Vite build inlines.
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/desktop vendor

      - if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Without a cache every PR rebuilds the whole Tauri dependency tree from
      # scratch, which is the difference between a ~3-minute job and a ~20-minute
      # one.
      - if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - if: steps.detect.outputs.present == 'true'
        run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - if: steps.detect.outputs.present == 'true'
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings -D clippy::perf

      - if: steps.detect.outputs.present == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/ui build

      # Unsigned and non-updating: the Authenticode certificate and the updater
      # keypair live in the release workflow's overlay config, not here, so a
      # fork's CI builds the same artifact without any secrets.
      - if: steps.detect.outputs.present == 'true'
        run: pnpm --filter @heimdall/desktop exec tauri build
