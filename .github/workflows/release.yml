name: Desktop release

# Tagged releases of the Windows capture client (§22.7). Deliberately separate
# from ci.yml: this job touches three sets of secrets and publishes artifacts,
# and none of that belongs on every pull request.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign, but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heimdall/ui build

      # Verifies the pinned SHA-256 before installing; a swapped upstream asset
      # fails the release rather than shipping silently.
      - run: pnpm --filter @heimdall/desktop vendor

      # Authenticode signing via Azure Trusted Signing: a cloud HSM, so CI needs
      # no physical EV token and the certificate never leaves Azure.
      - name: Install the signing CLI
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Select the production capability
        run: node apps/desktop/scripts/select-release-capability.mjs
        env:
          HEIMDALL_RELEASE_BUILD: "true"

      - name: Build, sign and bundle
        run: pnpm --filter @heimdall/desktop exec tauri build --features release-updates --config src-tauri/tauri.release.conf.json
        env:
          # ── 1. Ed25519 payload key (§22.3) ──────────────────────────────
          # Signs the uploaded frame Parquet. Tamper-evidence only: the server
          # records signature_valid and never gates acceptance on it. The
          # matching public half is the server's HEIMDALL_SIGNING_PUBLIC_KEY.
          HEIMDALL_SIGNING_PRIVATE_KEY: ${{ secrets.HEIMDALL_SIGNING_PRIVATE_KEY }}
          # Hub origin baked into the binary, so a shipped client cannot be
          # redirected by editing a config file.
          HEIMDALL_API_BASE_URL: ${{ vars.HEIMDALL_API_BASE_URL }}
          # The native PUT command accepts only this exact account + bucket;
          # webview input cannot redirect a capture to another network target.
          HEIMDALL_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          HEIMDALL_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HEIMDALL_RELEASE_BUILD: "true"

          # ── 2. Tauri updater keypair ────────────────────────────────────
          # Signs latest.json / the update artifact. Entirely unrelated to (1):
          # this is what stops a malicious update being installed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # ── 3. Authenticode certificate ─────────────────────────────────
          # Signs the installer itself, so Windows SmartScreen does not warn.
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe release/
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig release/
          ls -l release

      # The updater manifest the shipped client polls
      # (tauri.release.conf.json → plugins.updater.endpoints). `cargo tauri
      # build` emits the installer and its .sig but NOT this file — assembling
      # it is the caller's job, and without it every client's update check 404s
      # silently. Generated here rather than hand-maintained so the version,
      # asset name and signature cannot drift from what was actually built.
      - name: Write the updater manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";

          const { version } = JSON.parse(
            readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"),
          );
          const setup = readdirSync("release").find((name) => name.endsWith("-setup.exe"));
          if (!setup) throw new Error("no NSIS installer in release/");
          const signature = readFileSync(`release/${setup}.sig`, "utf8").trim();
          if (!signature) throw new Error(`${setup}.sig is empty — updater key missing?`);

          const manifest = {
            version,
            notes: `Heimdall Capture ${version}`,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature,
                url:
                  `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/` +
                  `${process.env.TAG}/${encodeURIComponent(setup)}`,
              },
            },
          };
          writeFileSync("release/latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(manifest);
          NODE
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: heimdall-capture-windows
          path: release/

      # latest.json is the updater manifest the shipped client polls. Publishing
      # it to the release is what makes the auto-update path live.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
