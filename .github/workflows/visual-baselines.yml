name: Regenerate visual baselines

# `@visual` Playwright baselines are platform-specific. The committed ones are
# `-chromium-win32.png` (generated on a dev machine); CI runs ubuntu, which is
# why the visual tier is excluded from the mandatory functional run.
#
# This workflow generates the `-chromium-linux.png` counterparts ON the runner
# that will assert them, and opens a PR with the result. Run it deliberately —
# never as part of a normal PR — because a regenerated baseline silently accepts
# whatever the UI currently looks like, including a regression.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are the baselines being regenerated? (goes in the PR body)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate on ubuntu and open a PR
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heimdall_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heimdall_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @heimdall/ui build
      - run: pnpm build
      - run: pnpm --filter @heimdall/web exec playwright install --with-deps chromium

      # Only the @visual tier, and only to write baselines.
      - name: Write baselines
        run: pnpm --filter @heimdall/web exec playwright test --grep "@visual" --update-snapshots
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heimdall_test

      # Prove the freshly-written baselines actually pass a clean assert run,
      # so the PR cannot land a baseline that is itself flaky.
      - name: Re-assert against the new baselines
        run: pnpm --filter @heimdall/web exec playwright test --grep "@visual"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/heimdall_test

      - name: Open a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/e2e/__screenshots__; then
            echo "No baseline changes — nothing to open a PR for."
            exit 0
          fi
          BRANCH="visual-baselines/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/web/e2e/__screenshots__
          git commit -m "test(e2e): regenerate @visual baselines on ubuntu

$REASON"
          git push origin "$BRANCH"
          gh pr create \
            --title "test(e2e): regenerate @visual baselines on ubuntu" \
            --body "Generated by the \`visual-baselines\` workflow on an ubuntu runner, then re-asserted against a clean run.

**Reason:** $REASON

Review the image diffs before merging — a regenerated baseline accepts whatever the UI currently looks like, including a regression."
